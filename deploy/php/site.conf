<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes
        AllowOverride None
        Require all denied
    </Directory>

    <LocationMatch "^/vk_bot/(callback\.php|admin/(index|audio|export|phrases)\.php)$">
        Require all granted
    </LocationMatch>

    LimitRequestBody 12582912
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>

<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 4
    MaxRequestWorkers 4
    MaxConnectionsPerChild 500
</IfModule>
